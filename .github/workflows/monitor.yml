name: Monitor catalog and voluntary usage
on:
  schedule:
    - cron: '19 * * * *'
  workflow_run:
    workflows: ['Collect and publish catalog']
    types: [completed]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      drill:
        description: 'Create a clearly marked synthetic alert to verify delivery'
        type: boolean
        default: false
      drill_recovery:
        description: 'Close the synthetic drill incident with simulated recovery'
        type: boolean
        default: false
      external_failure:
        description: 'External scheduler could not dispatch the collector'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: hot-pick-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: >-
      github.repository == 'jinsim/hot-pick' &&
      (github.event_name != 'issues' || startsWith(github.event.issue.title, '[Usage]'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check publication, reconcile alerts and aggregate opt-in reports
        env:
          GH_TOKEN: ${{ github.token }}
          EXTERNAL_SCHEDULER_FAILURE: ${{ inputs.external_failure == true && 'true' || 'false' }}
          MONITOR_DRILL_RECOVERY: ${{ inputs.drill_recovery == true && 'true' || 'false' }}
          MONITOR_DRILL: ${{ inputs.drill == true && 'true' || 'false' }}
          FAILED_RUN_URL: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.html_url || '' }}
        run: node monitoring/run.mjs
