<!doctype html><html lang="en"><meta charset="utf-8"><title>Preferences</title><style>body{font:16px system-ui}.action{display:block;width:100%;text-align:left;background:#174ea6;color:white;padding:12px 20px;border:0;border-radius:6px;font:inherit;cursor:pointer}</style><main><h1>Preferences</h1><form id="settings"><input id="name" aria-label="Display name" placeholder="Display name"><button class="action" type="submit">Save settings</button><div id="result" role="status" aria-live="polite" aria-atomic="true"></div></form></main><script>function save(){document.querySelector("#result").textContent="Saved: "+document.querySelector("#name").value}document.querySelector("#settings").addEventListener("submit",function(event){event.preventDefault();save()});</script></html>
