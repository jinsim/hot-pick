<!doctype html><html lang="en"><meta charset="utf-8"><title>Preferences</title><style>body{font:16px system-ui}.action{display:block;width:100%;text-align:inherit;background:#174ea6;color:white;padding:12px 20px;border:0;border-radius:6px;font:inherit;cursor:pointer}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}</style><main><h1>Preferences</h1><form id="settings"><label for="name" class="visually-hidden">Display name</label><input id="name" placeholder="Display name"><button type="submit" class="action">Save settings</button><div id="result" role="status" aria-live="polite"></div></form></main><script>function save(){document.querySelector("#result").textContent="Saved: "+document.querySelector("#name").value}document.querySelector("#settings").addEventListener("submit",function(event){event.preventDefault();save()})</script></html>
